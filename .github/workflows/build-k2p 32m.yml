name: Build K2P 32M Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fanchmwrt-25.12.4

      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev gawk git \
            subversion libssl-dev gettext zlib1g-dev swig unzip time rsync

      # ── 关键修复①：安装 feeds（libsqlite3/libmosquitto/libcurl 都在 feeds 里）──
      - name: Update & install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ── 关键修复②：去掉 -Werror（strtok_r 等 POSIX 函数未声明不再致命）──
      - name: Patch fcm packages (remove -Werror)
        run: |
          for f in $(find package/fcm -name Makefile); do
            sed -i 's/-Werror=implicit-function-declaration//g' "$f"
          done
          echo "=== remaining -Werror in fcm ==="
          grep -rn "Werror" package/fcm || echo "none"

      # ── 适配 32MB 闪存 ──
      - name: Patch DTS for 32MB flash
        run: |
          DTS="target/linux/ramips/dts/mt7621_phicomm_k2p.dts"
          sed -i 's/reg = <0xa0000 0xf60000>;/reg = <0xa0000 0x1f60000>;/' "$DTS"
          grep -A2 'label = "firmware"' "$DTS"

      - name: Configure
        run: |
          echo "CONFIG_TARGET_ramips=y" >> .config
          echo "CONFIG_TARGET_ramips_mt7621=y" >> .config
          echo "CONFIG_TARGET_ramips_mt7621_DEVICE_phicomm_k2p=y" >> .config
          echo "CONFIG_TARGET_KERNEL_PARTSIZE=32" >> .config
          echo "CONFIG_TARGET_ROOTFS_PARTSIZE=496" >> .config
          make defconfig

      - name: Build
        run: |
          make -j$(nproc) BUILD_LOG=1
          echo "=== Build complete ==="
          ls -lh bin/targets/ramips/mt7621/

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: k2p-32m-fanchmwrt-firmware
          path: bin/targets/ramips/mt7621/

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: logs/
          if-no-files-found: ignore
