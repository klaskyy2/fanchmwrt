name: Build K2P 32M Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fanchmwrt-25.12.4

      - name: Setup
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev gawk git \
            subversion libssl-dev gettext zlib1g-dev swig unzip time rsync

      - name: Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          cat >> .config << 'EOF'
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_phicomm_k2p=y
          CONFIG_TARGET_KERNEL_PARTSIZE=32
          CONFIG_TARGET_ROOTFS_PARTSIZE=496
          EOF
          make defconfig

      # 32MB 闪存适配：彻底清理 + 打补丁 + 验证 + 重编译
      - name: Patch DTS & Rebuild
        run: |
          # 1) 先验证 patch 前 DTS 内容
          echo "=== patch 前 firmware 分区 ==="
          grep 'reg = <0xa0000' target/linux/ramips/dts/mt7621_phicomm_k2p.dts

          # 2) 补丁 DTS（firmeware 分区 15.5MB → 31.5MB）
          sed -i 's/reg = <0xa0000 0xf60000>;/reg = <0xa0000 0x1f60000>;/' \
            target/linux/ramips/dts/mt7621_phicomm_k2p.dts

          # 3) 验证 patch 成功
          echo "=== patch 后 firmware 分区 ==="
          grep 'reg = <0xa0000' target/linux/ramips/dts/mt7621_phicomm_k2p.dts

          # 4) 彻底清理（删所有缓存，强制全量重编译）
          echo "=== 清理 build_dir / staging_dir / tmp ==="
          rm -rf build_dir/ staging_dir/ tmp/

          # 5) 去掉 -Werror（strtok_r 等隐式声明在新 GCC 下不再致命）
          find package/fcm -name Makefile -exec sed -i 's/-Werror=implicit-function-declaration//g' {} \;

          # 6) 强制重编译
          make -j$(nproc) BUILD_LOG=1

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: k2p-32m-fanchmwrt-firmware
          path: bin/targets/ramips/mt7621/

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: logs/
          if-no-files-found: ignore
