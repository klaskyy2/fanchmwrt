name: Build K2P 32M Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fanchmwrt-25.12.4

      - name: Setup
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev gawk git \
            subversion libssl-dev gettext zlib1g-dev swig unzip time rsync

      - name: Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Patch fcm
        run: |
          find package/fcm -name Makefile -exec sed -i 's/-Werror=implicit-function-declaration//g' {} \;

      - name: Patch DTS (32MB flash)
        run: |
          DTS="target/linux/ramips/dts/mt7621_phicomm_k2p.dts"
          sed -i 's/reg = <0xa0000 0xf60000>;/reg = <0xa0000 0x1f60000>;/' "$DTS"
          touch "$DTS"
          find build_dir -name "phicomm_k2p*.dtb" -delete 2>/dev/null || true
          find build_dir -name "*.dtb.o" -delete 2>/dev/null || true

      - name: Configure
        run: |
          cat >> .config << 'EOF'
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_phicomm_k2p=y
          CONFIG_TARGET_KERNEL_PARTSIZE=32
          CONFIG_TARGET_ROOTFS_PARTSIZE=496
          EOF
          make defconfig

      - name: Build
        run: |
          make -j$(nproc) BUILD_LOG=1

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: k2p-32m-fanchmwrt-firmware
          path: bin/targets/ramips/mt7621/

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: logs/
          if-no-files-found: ignore
