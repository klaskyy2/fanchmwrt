name: Build K2P Firmware

on:
  workflow_dispatch:  # 手动触发按钮

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fanchmwrt-25.12.4

      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev gawk git subversion libssl-dev gettext zlib1g-dev swig unzip time rsync

      - name: Configure and build K2P
        run: |
          make defconfig
          echo "CONFIG_TARGET_ramips=y" >> .config
          echo "CONFIG_TARGET_ramips_mt7621=y" >> .config
          echo "CONFIG_TARGET_ramips_mt7621_DEVICE_phicomm_k2p=y" >> .config
          make defconfig
          make -j$(nproc) BUILD_LOG=1

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: k2p-fanchmwrt-firmware
          path: bin/targets/ramips/mt7621/
